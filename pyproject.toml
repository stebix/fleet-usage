[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'fleet-usage'
version = '0.1.0'
description = 'Collect, publish and aggregate AI coding agent usage across a fleet of personal machines.'
readme = 'README.md'
requires-python = '>=3.12'
authors = [{ name = 'Jannik Stebani' }]
keywords = ['ccusage', 'llm', 'usage', 'reporting', 'cli']
classifiers = [
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Typing :: Typed',
]
dependencies = [
    'filelock>=3.16',
    'httpx>=0.28',
    'platformdirs>=4.3',
    'pydantic>=2.9',
    'python-dotenv>=1.0',
    'rich>=13.9',
    'typer>=0.15',
    # Windows ships no IANA database; zoneinfo falls back to this package.
    'tzdata>=2024.1; sys_platform == "win32"',
]

[project.scripts]
fleet-usage = 'fleet_usage.cli:main'

[dependency-groups]
dev = [
    'mypy>=1.13',
    'pytest>=8.3',
    'pytest-httpx>=0.35',
    'ruff>=0.8',
]

[tool.hatch.build.targets.wheel]
packages = ['src/fleet_usage']

[tool.hatch.build.targets.sdist]
include = ['/src', '/tests', '/README.md']

[tool.ruff]
line-length = 79
target-version = 'py312'
src = ['src', 'tests']

[tool.ruff.lint]
select = [
    'ANN',
    'B',
    'C4',
    'D',
    'E',
    'F',
    'I',
    'N',
    'PTH',
    'RET',
    'RUF',
    'SIM',
    'UP',
    'W',
]
ignore = [
    'ANN401',  # JSON helpers are genuinely dynamic
    'D203',
    'D213',
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.lint.isort]
known-first-party = ['fleet_usage']

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['ANN', 'D']
'src/fleet_usage/templates/*' = ['D']

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true

[tool.mypy]
python_version = '3.12'
strict = true
warn_unreachable = true
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = ['dotenv.*']
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
addopts = '-ra --strict-markers'
