# Managed by fleet-usage: 'fleet-usage repo init --update' rewrites it.
#
# The job runs on a stock runner without installing anything, because
# scripts/render_readme.py is a dependency free copy of the module
# fleet_usage.readme_render. The rendered README is written back with
# the Contents API rather than with git, so that the job never needs a
# working tree write or a push permission beyond the token it already
# has.
name: render-readme

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README
        run: python3 scripts/render_readme.py --data-dir . --output README.md

      - name: Publish README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          API = 'https://api.github.com'
          REPO = os.environ['GITHUB_REPOSITORY']
          BRANCH = os.environ['GITHUB_REF_NAME']
          TOKEN = os.environ['GITHUB_TOKEN']
          URL = f'{API}/repos/{REPO}/contents/README.md'
          HEADERS = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'fleet-usage-readme-workflow',
          }


          def call(method, url, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=body, method=method)
              for key, value in HEADERS.items():
                  request.add_header(key, value)
              if body is not None:
                  request.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read() or b'{}')


          def remote():
              try:
                  return call('GET', f'{URL}?ref={BRANCH}')
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise


          with open('README.md', 'rb') as handle:
              content = handle.read()
          encoded = base64.b64encode(content).decode('ascii')

          for attempt in range(3):
              current = remote()
              if current is not None and current.get('content'):
                  same = base64.b64decode(current['content']) == content
                  if same:
                      print('README.md is unchanged')
                      break
              payload = {
                  'message': 'fleet-usage: render README',
                  'content': encoded,
                  'branch': BRANCH,
              }
              if current is not None:
                  payload['sha'] = current['sha']
              try:
                  call('PUT', URL, payload)
              except urllib.error.HTTPError as error:
                  # 409 and 422 mean the blob SHA went stale between the
                  # GET and the PUT; fetch it again and retry.
                  if error.code not in (409, 422) or attempt == 2:
                      raise
                  time.sleep(2 * (attempt + 1))
                  continue
              print('README.md updated')
              break
          PY
